<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>见涨</title>
    <script>
      const themePreference = localStorage.getItem('jianzhang-theme-preference-v1')
      const startupTheme =
        themePreference === 'dark' ||
        (themePreference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark'
          : 'light'
      document.documentElement.dataset.theme = startupTheme
      document.documentElement.style.colorScheme = startupTheme
    </script>
    <style>
      :root {
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      :root[data-theme='dark'] {
        color: #e5edf8;
        background: #0b1220;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        min-width: 760px;
        font-size: 14px;
      }
    </style>
    <link rel="stylesheet" href="/src/components/StartupOverlay.css" />
  </head>
  <body>
    <div id="startup-shell" class="startup-overlay" role="status" aria-live="polite">
      <div class="startup-titlebar">
        <span class="startup-brand-mark" aria-hidden="true">↗</span>
        <span class="startup-brand-name">见涨</span>
      </div>
      <div class="startup-content">
        <div class="startup-status">
          <span class="startup-spinner" aria-hidden="true"></span>
          <span>正在启动见涨…</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/entries/main-window-entry.tsx"></script>
  </body>
</html>
