<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>见涨</title>
    <script>
      const themePreference = localStorage.getItem('jianzhang-theme-preference-v1')
      const startupTheme =
        themePreference === 'dark' ||
        (themePreference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark'
          : 'light'
      document.documentElement.dataset.theme = startupTheme
      document.documentElement.style.colorScheme = startupTheme
    </script>
    <style>
      :root {
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      :root[data-theme='dark'] {
        color: #e5edf8;
        background: #0b1220;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root,
      #startup-shell {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        min-width: 760px;
        font-size: 14px;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.96);
      }

      :root[data-theme='dark'] #startup-shell {
        background: #0b1220;
      }

      .startup-titlebar {
        height: 44px;
        flex: 0 0 44px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 16px;
        border-bottom: 1px solid #e4e9f1;
        background: rgba(255, 255, 255, 0.94);
        -webkit-app-region: drag;
      }

      :root[data-theme='dark'] .startup-titlebar {
        border-color: #263449;
        background: #111827;
      }

      .startup-brand-mark {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        color: #ffffff;
        background: #dc3742;
        font-size: 16px;
        font-weight: 800;
        line-height: 1;
      }

      .startup-brand-name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .startup-content {
        flex: 1;
        display: grid;
        place-items: center;
        background: #f4f7fb;
      }

      :root[data-theme='dark'] .startup-content {
        background: #0b1220;
      }

      .startup-status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #667085;
        font-size: 14px;
        font-weight: 600;
      }

      :root[data-theme='dark'] .startup-status {
        color: #98a6ba;
      }

      .startup-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #dbe4f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: startup-spin 720ms linear infinite;
      }

      :root[data-theme='dark'] .startup-spinner {
        border-color: #34445d;
        border-top-color: #5b8cff;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-shell" role="status" aria-live="polite">
      <div class="startup-titlebar">
        <span class="startup-brand-mark" aria-hidden="true">↗</span>
        <span class="startup-brand-name">见涨</span>
      </div>
      <div class="startup-content">
        <div class="startup-status">
          <span class="startup-spinner" aria-hidden="true"></span>
          <span>正在启动见涨…</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/entries/main-window-entry.tsx"></script>
  </body>
</html>
